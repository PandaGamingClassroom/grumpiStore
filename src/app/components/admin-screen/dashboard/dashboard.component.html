<app-nav-bar-admin></app-nav-bar-admin>
<div class="container mt-4">
  <!-- Selección del tipo de objeto -->
  <div class="mb-3">
    <label for="objectType"><strong>Selecciona el objeto a asignar:</strong></label>
    <select id="objectType" class="form-select" [(ngModel)]="selectedObjectType">
      <option value="grumpis">Grumpis</option>
      <option value="medallas">Medallas</option>
      <option value="distintivos">Distintivos de liga</option>
      <option value="recompensas">Recompensas</option>
    </select>
  </div>

  <!-- Tabla de entrenadores por profesor -->
  <div *ngFor="let profesor of profesores">
    <h4 class="mt-3">{{ profesor.name }}</h4>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Entrenador</th>
          <th>{{ selectedObjectType | titlecase }}</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let trainer of profesor.entrenadores">
          <td>{{ trainer.name }}</td>
          <td>
            <!-- Mostramos dinámicamente según el objeto -->
            <ng-container [ngSwitch]="selectedObjectType">
              <ul *ngSwitchCase="'grumpis'">
                <li *ngFor="let grumpi of trainer.grumpis">{{ grumpi.nombre }}</li>
              </ul>

              <ul *ngSwitchCase="'medallas'">
                <li *ngFor="let medal of trainer.medallas">{{ medal.nombre }}</li>
              </ul>

              <ul *ngSwitchCase="'distintivos'">
                <li *ngFor="let badge of trainer.distintivos_liga">{{ badge.nombre }}</li>
              </ul>

              <ul *ngSwitchCase="'recompensas'">
                <li *ngFor="let reward of trainer.recompensas">{{ reward.nombre }}</li>
              </ul>
            </ng-container>
          </td>
          <td>
            <button class="btn btn-primary btn-sm" (click)="openAssignModal(trainer)">
              Asignar {{ selectedObjectType }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
