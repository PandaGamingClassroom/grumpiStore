<app-nav-bar-admin></app-nav-bar-admin>

<div class="container mt-4">
  <div *ngIf="profesor">
    <div class="table-responsive" style="max-height: 500px; overflow-y: auto">
      <table class="table table-bordered table-striped" *ngIf="trainers?.length">
        <thead class="table-light">
          <tr>
            <th><input type="checkbox" disabled /> Entrenador</th>
            <th>Grumpis</th>
            <th>Medallas</th>
            <th>Distintivos de Liga</th>
            <th>Recompensas</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let trainer of trainers || []; trackBy: trackById">
            <!-- Nombre + checkbox -->
            <td>
              <input
                type="checkbox"
                (change)="toggleTrainerSelection(trainer, $event)"
              />
              {{ trainer.name }}
            </td>

            <!-- Columna Grumpis -->
            <td>
              <ul>
                <li *ngFor="let grumpi of trainer.grumpis || []">
                  {{ grumpi.nombre }}
                  <button
                    class="btn btn-sm btn-danger ms-2"
                    (click)="removeObjectFromTrainer(trainer, grumpi, 'grumpis')"
                  >
                    ✖
                  </button>
                </li>
              </ul>
              <button
                class="btn btn-sm btn-primary mt-1"
                (click)="openAssignModal(trainer, 'grumpis')"
              >
                ➕ Añadir
              </button>
            </td>

            <!-- Columna Medallas -->
            <td>
              <ul>
                <li *ngFor="let medal of trainer.medallas || []">
                  {{ medal.nombre }}
                  <button
                    class="btn btn-sm btn-danger ms-2"
                    (click)="removeObjectFromTrainer(trainer, medal, 'medallas')"
                  >
                    ✖
                  </button>
                </li>
              </ul>
              <button
                class="btn btn-sm btn-primary mt-1"
                (click)="openAssignModal(trainer, 'medallas')"
              >
                ➕ Añadir
              </button>
            </td>

            <!-- Columna Distintivos -->
            <td>
              <ul>
                <li *ngFor="let badge of trainer.distintivos_liga || []">
                  {{ badge.nombre }}
                  <button
                    class="btn btn-sm btn-danger ms-2"
                    (click)="removeObjectFromTrainer(trainer, badge, 'distintivos_liga')"
                  >
                    ✖
                  </button>
                </li>
              </ul>
              <button
                class="btn btn-sm btn-primary mt-1"
                (click)="openAssignModal(trainer, 'distintivos')"
              >
                ➕ Añadir
              </button>
            </td>

            <!-- Columna Recompensas -->
            <td>
              <ul>
                <li *ngFor="let reward of trainer.recompensas || []">
                  {{ reward.nombre }}
                  <button
                    class="btn btn-sm btn-danger ms-2"
                    (click)="removeObjectFromTrainer(trainer, reward, 'recompensas')"
                  >
                    ✖
                  </button>
                </li>
              </ul>
              <button
                class="btn btn-sm btn-primary mt-1"
                (click)="openAssignModal(trainer, 'recompensas')"
              >
                ➕ Añadir
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal reutilizable -->
<div class="modal fade" id="assignModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          Asignar {{ modalObjectType | titlecase }} a
          {{ selectedTrainer?.name }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="modalObjectType === 'grumpis'">
          <label>Selecciona un Grumpi:</label>
          <select class="form-select" [(ngModel)]="selectedObject">
            <option *ngFor="let g of grumpisDisponibles" [ngValue]="g">
              {{ g.nombre }}
            </option>
          </select>
        </div>

        <div *ngIf="modalObjectType === 'medallas'">
          <label>Selecciona una Medalla:</label>
          <select class="form-select" [(ngModel)]="selectedObject">
            <option *ngFor="let m of medallasDisponibles" [ngValue]="m">
              {{ m.nombre }}
            </option>
          </select>
        </div>

        <div *ngIf="modalObjectType === 'distintivos'">
          <label>Selecciona un Distintivo:</label>
          <select class="form-select" [(ngModel)]="selectedObject">
            <option *ngFor="let d of distintivosDisponibles" [ngValue]="d">
              {{ d.nombre }}
            </option>
          </select>
        </div>

        <div *ngIf="modalObjectType === 'recompensas'">
          <label>Selecciona una Recompensa:</label>
          <select class="form-select" [(ngModel)]="selectedObject">
            <option *ngFor="let r of recompensasDisponibles" [ngValue]="r">
              {{ r.nombre }}
            </option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button
          class="btn btn-primary"
          (click)="assignObjectToTrainer(selectedObject, modalObjectType)"
          data-bs-dismiss="modal"
        >
          Asignar
        </button>
      </div>
    </div>
  </div>
</div>
