<div class="floating_btn_menu_box">
  <button
    type="button"
    class="floating_btn_menu"
    data-bs-toggle="modal"
    data-bs-target="#open_menu_game"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
      <path fill-rule="evenodd"
        d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
    </svg>
  </button>
</div>

<!-- Modal Menú -->
<div class="modal fade" id="open_menu_game" tabindex="-1" aria-labelledby="open_menu_game" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="open_menu_game">Menú entrenador</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-center align-items-center flex-wrap">
          <button type="button" class="me-2 mb-2 button-73">Grumpis</button>
          <button type="button" class="me-2 mb-2 button-73">Recompensas</button>
          <button type="button" class="me-2 mb-2 button-73">Objetos evolutivos</button>
          <button type="button" class="me-2 mb-2 button-73">Medallas</button>
          <button type="button" class="me-2 mb-2 button-73">Distintivos de liga</button>
          <button type="button" class="me-2 mb-2 button-73">Energías</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="button-73" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Tabla de energías -->
<div class="energy-table-container">
  <table class="energy-table">
    <thead>
      <tr>
        <th rowspan="2">ENTRENADORES</th>
        <th colspan="9">ENERGÍAS</th>
      </tr>
      <tr>
        <th *ngFor="let energyIcon of energyIcons">
          <img class="imgEnergy" [src]="energyIcon.src" [alt]="energyIcon.alt" />
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let trainer of trainers; trackBy: trackById">
        <td>{{ trainer.name }}</td>
        <td *ngFor="let energia of trainer.energies">
          <div class="energy-input">
            <button type="button" (click)="decrementEnergy(trainer, energia.tipo)">-</button>
            <input
              type="number"
              [value]="energia.cantidad"
              (change)="updateEnergy(trainer, energia.tipo, $event)"
              min="0"
            />
            <button type="button" (click)="incrementEnergy(trainer, energia.tipo)">+</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="actions mt-3">
    <button type="button" class="button-73 me-2" (click)="guardarCambios()">Guardar cambios</button>
    <button type="button" class="button-73" (click)="cancelarCambios()">Cancelar cambios</button>
  </div>
</div>
